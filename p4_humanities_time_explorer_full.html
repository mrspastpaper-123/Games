let state=JSON.parse(localStorage.getItem('p4DeepGame')||'{}');
state=Object.assign({char:null,emoji:null,gems:0,streak:0,badges:{},done:{},mistakes:[],stats:{games:0,answered:0,correct:0,start:Date.now(),areaCorrect:{},areaTotal:{}}},state);
let current={area:null,level:1,questions:[],idx:0,wrong:0,tries:2,mistakeMode:false};
function save(){localStorage.setItem('p4DeepGame',JSON.stringify(state));updateHud()}
function hideAll(){['screenCharacter','screenMap','screenLevels','screenQuiz','screenDashboard','screenMistakes'].forEach(id=>document.getElementById(id).classList.add('hidden'))}
function updateHud(){document.getElementById('gems').textContent=state.gems;document.getElementById('streak').textContent=state.streak;document.getElementById('badgeCount').textContent=Object.keys(state.badges).length;document.getElementById('playerInfo').textContent=state.char?`${state.emoji} ${state.char}｜💎 ${state.gems}`:'未選角色'}
document.querySelectorAll('.char').forEach(c=>c.onclick=()=>{state.char=c.dataset.char;state.emoji=c.dataset.emoji;save();goMap()});
function goMap(){hideAll();document.getElementById('screenMap').classList.remove('hidden');renderPlanets();save()}
function renderPlanets(){let box=document.getElementById('planetGrid');box.innerHTML='';planets.forEach((p,i)=>{let area=p[0],doneCount=[1,2,3,4,5].filter(l=>state.done[area+'-'+l]).length;let div=document.createElement('div');div.className='card planet';div.innerHTML=`<div class="emoji">${p[1]}</div><h3>${area}</h3><small>${p[2]}</small><div class="levels">${[1,2,3,4,5].map(l=>`<span class="level ${state.done[area+'-'+l]?'done':''}">L${l}</span>`).join('')}</div><p>完成：${doneCount}/5 ${state.badges[area]?'🏅 已獲徽章':''}</p><button class="secondary">進入星球</button>`;div.querySelector('button').onclick=()=>openLevels(area,p[1]);box.appendChild(div)})}
function openLevels(area,emoji){current.area=area;hideAll();document.getElementById('screenLevels').classList.remove('hidden');document.getElementById('levelTitle').textContent=`${emoji} ${area}｜選擇 Level`;let box=document.getElementById('levelGrid');box.innerHTML='';for(let l=1;l<=5;l++){let d=document.createElement('div');d.className='card';d.innerHTML=`<h2>Level ${l}</h2><p>10題高階選擇題</p><p>${state.done[area+'-'+l]?'✅ 已完成':'🔒 待挑戰'}</p><button class="primary">開始挑戰</button>`;d.querySelector('button').onclick=()=>startQuiz(area,l);box.appendChild(d)}}
function goLevels(){openLevels(current.area,planets.find(p=>p[0]==current.area)[1])}
function makeLevelQuestions(area,level){let base=templates[area];let arr=[];for(let i=0;i<10;i++){let b=base[(i+level-1)%base.length];arr.push({q:`Level ${level}｜${b[0]}`,a:[...b[1]],correct:b[1][b[2]],hint:b[3],area,level})}return arr}
function shuffleQuestion(q){let opts=q.a.map(x=>({text:x,ok:x===q.correct}));for(let i=opts.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[opts[i],opts[j]]=[opts[j],opts[i]]}return {...q,opts}}
function startQuiz(area,level){current={area,level,questions:makeLevelQuestions(area,level).map(shuffleQuestion),idx:0,wrong:0,tries:2,mistakeMode:false};state.stats.games++;save();showQuestion()}
function showQuestion(){hideAll();document.getElementById('screenQuiz').classList.remove('hidden');let q=current.questions[current.idx];document.getElementById('quizArea').textContent=current.area;document.getElementById('quizLevel').textContent=current.mistakeMode?'錯題練習':`Level ${current.level}`;document.getElementById('wrongCount').textContent=current.wrong;document.getElementById('triesLeft').textContent=current.tries;document.getElementById('progressText').textContent=`第 ${current.idx+1} / ${current.questions.length} 題`;document.getElementById('progressBar').style.width=(current.idx/current.questions.length*100)+'%';document.getElementById('questionText').textContent=q.q;let opt=document.getElementById('options');opt.innerHTML='';document.getElementById('feedback').className='feedback hidden';q.opts.forEach((o,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+i)+'. '+o.text;b.onclick=()=>answer(o);opt.appendChild(b)})}
function answer(o){let q=current.questions[current.idx];state.stats.answered++;state.stats.areaTotal[current.area]=(state.stats.areaTotal[current.area]||0)+1;let fb=document.getElementById('feedback');fb.classList.remove('hidden');if(o.ok){state.gems+=5;state.streak++;state.stats.correct++;state.stats.areaCorrect[current.area]=(state.stats.areaCorrect[current.area]||0)+1;let bonus='';if(state.streak%5===0){state.gems+=20;bonus='<br>🔥 連續答對5題！Bonus +20 Gems'}fb.className='feedback correct';fb.innerHTML=`🎉 Good Job！<br>💎 +5 Gems ${bonus}<br><button class="primary" onclick="nextQ()">下一題 ▶</button>`;beep(780)}else{state.streak=0;current.tries--;current.wrong++;state.mistakes.push({date:new Date().toLocaleString('zh-HK'),area:current.area,level:current.level,question:q.q,wrong:o.text,correct:q.correct});fb.className='feedback wrong';beep(220);if(current.wrong>=3){fb.innerHTML=`💡 已答錯3題，需要重新開始本Level。<br>正確答案：${q.correct}<br><button class="danger" onclick="startQuiz('${current.area}',${current.level})">重新開始</button>`}else if(current.tries>0){fb.innerHTML=`💡 提示：${q.hint}<br>請再試一次。<br><button class="secondary" onclick="showQuestion()">請再試一次</button>`}else{fb.innerHTML=`💡 正確答案：${q.correct}<br><button class="primary" onclick="nextQ()">下一題 ▶</button>`;current.tries=2}}save()}
function nextQ(){current.idx++;current.tries=2;if(current.idx>=current.questions.length){completeLevel()}else showQuestion()}
function completeLevel(){document.getElementById('progressBar').style.width='100%';let key=current.area+'-'+current.level;state.done[key]=true;if([1,2,3,4,5].every(l=>state.done[current.area+'-'+l])) state.badges[current.area]=true;save();hideAll();document.getElementById('screenQuiz').classList.remove('hidden');document.getElementById('questionText').innerHTML=`<div class="celebrate">🎆 恭喜完成 Level ${current.level}！</div><p>🏅 收集進度已更新！</p><button class="primary" onclick="goMap()">返回星球地圖</button>`;document.getElementById('options').innerHTML='';document.getElementById('feedback').className='feedback hidden';beep(980)}
function showDashboard(){hideAll();document.getElementById('screenDashboard').classList.remove('hidden');let mins=Math.max(1,Math.round((Date.now()-state.stats.start)/60000));document.getElementById('studyTime').textContent=mins+'分鐘';document.getElementById('gamesPlayed').textContent=state.stats.games+'次';document.getElementById('doneLevels').textContent=Object.keys(state.done).length+' / 40';document.getElementById('accuracy').textContent=state.stats.answered?Math.round(state.stats.correct/state.stats.answered*100)+'%':'0%';let rows=planets.map(p=>{let a=p[0],t=state.stats.areaTotal[a]||0,c=state.stats.areaCorrect[a]||0,rate=t?Math.round(c/t*100):0;return {a,t,rate}}).filter(x=>x.t);rows.sort((x,y)=>y.rate-x.rate);let strong=rows.slice(0,2).map(x=>`✅ ${x.a}：${x.rate}%`).join('<br>')||'暫未有足夠數據';let weak=rows.slice(-2).reverse().map(x=>`⚠️ ${x.a}：${x.rate}%`).join('<br>')||'暫未有足夠數據';document.getElementById('analysisBox').innerHTML=`<div class="grid"><div class="card"><h3>強項</h3>${strong}</div><div class="card"><h3>建議多練習</h3>${weak}</div></div>`}
function showMistakes(){hideAll();document.getElementById('screenMistakes').classList.remove('hidden');let box=document.getElementById('mistakeList');if(!state.mistakes.length){box.innerHTML='<p>暫時沒有錯題，繼續保持！</p>';return}box.innerHTML=`<table class="table"><tr><th>日期</th><th>區域</th><th>題目</th><th>錯誤答案</th><th>正確答案</th></tr>${state.mistakes.slice(-30).reverse().map(m=>`<tr><td>${m.date}</td><td>${m.area}</td><td>${m.question}</td><td>${m.wrong}</td><td>${m.correct}</td></tr>`).join('')}</table>`}
function startMistakePractice(){if(!state.mistakes.length)return alert('暫時沒有錯題');current={area:'錯題簿',level:0,questions:state.mistakes.slice(-10).map(m=>shuffleQuestion({q:m.question,a:[m.correct,m.wrong,'以上皆非','需要更多資料判斷'],correct:m.correct,hint:'回想你上次答錯的地方。',area:m.area,level:m.level})),idx:0,wrong:0,tries:2,mistakeMode:true};showQuestion()}
function beep(freq){try{let ctx=new (window.AudioContext||window.webkitAudioContext)();let osc=ctx.createOscillator();let gain=ctx.createGain();osc.frequency.value=freq;osc.connect(gain);gain.connect(ctx.destination);gain.gain.setValueAtTime(.08,ctx.currentTime);osc.start();osc.stop(ctx.currentTime+.12)}catch(e){}}
function resetAll(){if(confirm('確定清除所有進度？')){localStorage.removeItem('p4DeepGame');location.reload()}}
updateHud(); if(state.char) goMap();
</script></body></html>
