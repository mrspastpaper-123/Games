DATA["資訊新世代"]=pack(Array.from({length:50},(_,i)=>{const qs=[["使用互聯網時應保護甚麼？",["個人資料","垃圾","病毒","謠言"],0],["強密碼應包含甚麼？",["大小寫字母、數字和符號","生日日期","123456","自己的名字"],0],["看到可疑連結應該怎樣？",["不要隨便點擊","立即輸入資料","轉發給所有人","下載不明檔案"],0],["網上發言應該：",["有禮和負責任","欺凌別人","散播謠言","公開他人私隱"],0],["人工智能可以幫助我們：",["學習和整理資料","代替所有思考","破壞電腦","偷取資料"],0],["網絡欺凌可能造成甚麼？",["心理傷害","改善友誼","增加安全","提升健康"],0],["使用資料時要注意甚麼？",["來源是否可靠","只看標題","全部相信","不用查證"],0],["沉迷電子產品可能影響：",["健康和學習","地球自轉","雨量","山脈高度"],0],["遇到網上危險應：",["告訴可信任成人","隱瞞","繼續聊天","公開地址"],0],["良好數碼公民應做到：",["安全、尊重和負責任","亂傳資料","攻擊別人","不守規則"],0]];let x=qs[i%10];return {q:`Level ${Math.floor(i/10)+1}：${x[0]}`,a:x[1],c:x[2]}}));

let state={area:null,level:0,questions:[],i:0,gems:+localStorage.getItem('gems')||0,streak:0,wrongTotal:0,tries:0,correct:0,played:+localStorage.getItem('played')||0,completed:+localStorage.getItem('completed')||0,start:Date.now()};
function save(){localStorage.setItem('gems',state.gems);localStorage.setItem('played',state.played);localStorage.setItem('completed',state.completed)}
function shuffleQuestion(q){let opts=q.a.map((text,idx)=>({text,correct:idx===q.c}));opts.sort(()=>Math.random()-.5);return {...q,opts,correctIndex:opts.findIndex(o=>o.correct)}}
function showOnly(id){['home','levelSelect','game','dashboard','wrongBook'].forEach(x=>document.getElementById(x).classList.add('hidden'));document.getElementById(id).classList.remove('hidden')}
function init(){document.getElementById('homeGems').textContent=state.gems;document.getElementById('areaGrid').innerHTML=areas.map(a=>`<div class="card area ${DATA[a]?'':'locked'}" onclick="${DATA[a]?`chooseArea('${a}')`:''}"><div class="badge">${DATA[a]?'🌍':'🔒'}</div><h3>${a}</h3><p>${DATA[a]?'5 Levels｜50 題':'稍後加入題庫'}</p></div>`).join('')}
function chooseArea(a){state.area=a;document.getElementById('areaTitle').textContent='探索區域：'+a;document.getElementById('levelButtons').innerHTML=[1,2,3,4,5].map(n=>`<button class="btn" onclick="startLevel(${n-1})">Level ${n}</button>`).join('');showOnly('levelSelect')}
function startLevel(l){state.level=l;state.questions=DATA[state.area][l].map(shuffleQuestion);state.i=0;state.streak=0;state.wrongTotal=0;state.tries=0;state.correct=0;state.played++;save();showOnly('game');renderQ()}
function renderQ(){let q=state.questions[state.i];document.getElementById('gameArea').textContent=state.area;document.getElementById('levelNo').textContent=state.level+1;document.getElementById('gems').textContent=state.gems;document.getElementById('wrongCount').textContent=state.wrongTotal;document.getElementById('progressBar').style.width=(state.i/state.questions.length*100)+'%';document.getElementById('questionText').textContent=`第 ${state.i+1} 題：${q.q}`;document.getElementById('options').innerHTML=q.opts.map((o,idx)=>`<button class="option" onclick="answer(${idx})">${'ABCD'[idx]}. ${o.text}</button>`).join('');document.getElementById('feedback').innerHTML='';document.getElementById('nextBtn').classList.add('hidden');document.getElementById('retryBtn').classList.add('hidden')}
function answer(idx){let q=state.questions[state.i];document.querySelectorAll('.option').forEach(b=>b.disabled=true);if(idx===q.correctIndex){state.gems+=5;state.streak++;state.correct++;let msg='🎉<br>Good Job！<br>⭐ +5 Gems'; if(state.streak>0 && state.streak%5===0){state.gems+=20;msg+='<br>💎 Bonus 20 Gems！'}document.getElementById('feedback').innerHTML='<div class="celebrate">'+msg+'</div>';document.getElementById('nextBtn').classList.remove('hidden');}else{state.tries++;state.wrongTotal++;state.streak=0;recordWrong(q,idx);if(state.wrongTotal>=3){document.getElementById('feedback').innerHTML='💡 提示：答錯 3 題，要重新開始本 Level。';setTimeout(()=>startLevel(state.level),1200)}else if(state.tries<2){document.getElementById('feedback').innerHTML='💡 提示：請再想想題目關鍵字。';document.getElementById('retryBtn').classList.remove('hidden')}else{document.getElementById('feedback').innerHTML=`正確答案是：${q.opts[q.correctIndex].text}`;document.getElementById('nextBtn').classList.remove('hidden')}}save();document.getElementById('gems').textContent=state.gems;document.getElementById('wrongCount').textContent=state.wrongTotal}
function retryQuestion(){state.tries=0;renderQ()}
function nextQuestion(){state.tries=0;state.i++;if(state.i>=state.questions.length){state.completed++;save();document.getElementById('progressBar').style.width='100%';document.getElementById('questionText').innerHTML='🎊 Level 完成！你獲得 🏅 人文徽章 1 個！';document.getElementById('options').innerHTML='';document.getElementById('feedback').innerHTML='完成慶祝音效：叮叮叮！';document.getElementById('nextBtn').classList.add('hidden');setTimeout(()=>chooseArea(state.area),1500)}else renderQ()}
function recordWrong(q,idx){let wb=JSON.parse(localStorage.getItem('wrongBook')||'[]');wb.push({date:new Date().toLocaleString('zh-HK'),question:q.q,wrong:q.opts[idx].text,correct:q.opts[q.correctIndex].text,area:state.area,level:state.level+1});localStorage.setItem('wrongBook',JSON.stringify(wb))}
function showDashboard(){let wb=JSON.parse(localStorage.getItem('wrongBook')||'[]');let acc=state.played?Math.max(0,Math.round((1-wb.length/(state.played*10))*100)):100;document.getElementById('stats').innerHTML=`<div class="stat">本週學習時間<br><strong>${Math.max(1,Math.round((Date.now()-state.start)/60000))}</strong> 分鐘</div><div class="stat">總遊戲次數<br><strong>${state.played||12}</strong> 次</div><div class="stat">完成關卡<br><strong>${state.completed}</strong> / 50</div><div class="stat">準確率<br><strong>${acc}%</strong></div>`;let weak=wb.length?wb[wb.length-1].area:'暫時沒有明顯弱項';document.getElementById('analysisText').textContent=`強項：已完成的關卡。弱項：${weak}。建議多練習錯題簿內的題目，特別留意容易混淆的地圖、氣候、自然資源和安全知識。`;showOnly('dashboard')}
function showWrongBook(){let wb=JSON.parse(localStorage.getItem('wrongBook')||'[]');document.getElementById('wrongTable').innerHTML=wb.length?`<table><tr><th>日期</th><th>題目</th><th>錯誤答案</th><th>正確答案</th></tr>${wb.map(x=>`<tr><td>${x.date}</td><td>${x.question}</td><td>${x.wrong}</td><td>${x.correct}</td></tr>`).join('')}</table>`:'暫時沒有錯題。';showOnly('wrongBook')}
function startWrongPractice(){let wb=JSON.parse(localStorage.getItem('wrongBook')||'[]');if(!wb.length){alert('暫時沒有錯題');return}state.area='錯題練習';state.level=0;state.questions=wb.map(x=>shuffleQuestion({q:x.question,a:[x.correct,x.wrong,'再想一想','以上皆不是'],c:0}));state.i=0;state.wrongTotal=0;state.streak=0;showOnly('game');renderQ()}
function goHome(){showOnly('home');init()}init();
</script>
